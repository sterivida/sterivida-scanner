<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2b30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escanear">
<meta name="referrer" content="no-referrer">
<title>Escanear envelope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316808a'/%3E%3Cpath d='M14 24v-8a2 2 0 0 1 2-2h8M40 14h8a2 2 0 0 1 2 2v8M50 40v8a2 2 0 0 1-2 2h-8M24 50h-8a2 2 0 0 1-2-2v-8' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='25' y='25' width='14' height='14' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* v3: modo "vários envelopes", moldura e instrução desde o primeiro instante, entrada/saída suaves */
:root{--cor:#16808a;--cor-esc:#0d2b30;--ok:#2fb36d;--erro:#e5484d;--txt-2:rgba(255,255,255,.8);--vidro:rgba(13,43,48,.72);--fundo-app:#eef2f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;background:#0b1416}
#cena{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#18343a,#0b1416)}
/* o vídeo entra devagar quando a câmera já mostra imagem (sem tela preta nem piscada) */
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.ao-vivo video{opacity:1}
.topo{position:absolute;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#000a,#0000);z-index:2}
.topo h1{font-size:1.05rem;margin:0;font-weight:650}.topo small{color:var(--txt-2);font-size:.8rem}
.moldura{position:absolute;left:50%;top:42%;width:min(74vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);z-index:1}
.moldura i{position:absolute;width:38px;height:38px;border:5px solid #fff}
.moldura i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:22px 0 0 0}
.moldura i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
.moldura i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-radius:0 0 0 22px}
.moldura i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 22px 0}
.moldura::after{content:"";position:absolute;left:8%;right:8%;height:2px;top:10%;background:linear-gradient(90deg,#0000,#fff,#0000);animation:varre 2.2s ease-in-out infinite}
@keyframes varre{0%,100%{top:10%}50%{top:88%}}
.lido .moldura i{border-color:var(--ok)}.lido .moldura::after{display:none}.erro .moldura i{border-color:var(--erro)}
@media (prefers-reduced-motion:reduce){.moldura::after{animation:none;top:50%}video{transition:none}}
#msg{position:absolute;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));text-align:center;font-size:1rem;line-height:1.35;padding:10px 14px;border-radius:14px;
  background:var(--vidro);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:520px;margin:0 auto;z-index:2;transition:background .2s}
.lido #msg{background:rgba(47,179,109,.92)}.erro #msg{background:rgba(229,72,77,.92)}
.varios #msg{bottom:calc(240px + env(safe-area-inset-bottom))}
.varios .moldura{top:36%;width:min(64vw,280px)}
.barra{position:absolute;left:0;right:0;bottom:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;background:linear-gradient(#0000,#000a);z-index:2}
.btn{appearance:none;border:0;cursor:pointer;color:#fff;font:inherit;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-width:72px;min-height:64px;padding:8px 10px;border-radius:16px;background:var(--vidro)}
.btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{background:var(--cor)}.btn[hidden]{display:none}
/* lista do modo "vários envelopes" */
#lista{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:3;max-width:520px;margin:0 auto;display:none;
  background:rgba(255,255,255,.96);color:#14272b;border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.varios #lista{display:block}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:30px;align-items:center}
#chips span{flex:none;background:#e6f4ee;color:#1d6b46;border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:650}
#chips em{color:#4a6166;font-size:.85rem}
#bRegistrar{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--cor);color:#fff;font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer}
#bRegistrar:disabled{opacity:.45}
#limpar{background:none;border:0;color:#4a6166;text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:6px 2px 0}
#inicio{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:4}
.sem-camera #inicio{display:flex}.sem-camera .moldura,.sem-camera #msg,.sem-camera .barra,.sem-camera #lista{display:none}
.cartao{width:100%;max-width:380px;text-align:center}.cartao h2{font-size:1.25rem;margin:.2rem 0 .5rem}.cartao p{color:var(--txt-2);line-height:1.45}
.cartao button{width:100%;min-height:50px;border-radius:14px;font:inherit;cursor:pointer;margin-top:10px}
.cartao .grande{border:0;background:var(--cor);color:#fff;font-weight:650;font-size:1.05rem}
.cartao .sec{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff}
/* véu claro ao voltar para o app (mesma cor de fundo do app: sem clarão escuro→branco) */
#veu{position:fixed;inset:0;z-index:9;background:var(--fundo-app);color:#1d2733;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .35s ease}
.saindo #veu{opacity:1;pointer-events:auto}
#veu i{width:34px;height:34px;border-radius:50%;border:4px solid #c9d6dc;border-top-color:var(--cor);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:#fff;color:#14272b}
dialog::backdrop{background:rgba(0,0,0,.6)}dialog h2{margin:0 0 4px;font-size:1.1rem}dialog p{margin:.2rem 0 .8rem;color:#4a6166;font-size:.9rem}
dialog input{width:100%;font:inherit;font-size:1rem;padding:12px;border:1px solid #b9c9cc;border-radius:12px}
dialog .acoes{display:flex;gap:10px;margin-top:14px}dialog .acoes button{flex:1;min-height:46px;border-radius:12px;border:1px solid #b9c9cc;background:#fff;font:inherit;cursor:pointer}
dialog .acoes .ok{background:var(--cor);border-color:var(--cor);color:#fff;font-weight:650}
.oculto{display:none!important}
</style>
</head>
<body>
<div id="cena">
  <video id="video" playsinline muted autoplay></video>
  <div class="topo"><h1 id="titulo">Escanear envelope</h1><small id="sub">Aproxime o QR até ele preencher a moldura · toque na tela para focar</small></div>
  <div class="moldura" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="msg" role="status" aria-live="polite">Aponte para o QR da etiqueta</div>
  <div id="lista" aria-live="polite">
    <div id="chips"><em>Nenhum envelope lido ainda</em></div>
    <button id="bRegistrar" type="button" disabled>Registrar envelopes</button>
    <button id="limpar" type="button">limpar a lista</button>
  </div>
  <section id="inicio">
    <div class="cartao">
      <h2 id="tIni">Câmera desligada</h2>
      <p id="pIni">Toque no botão e permita o uso da câmera.</p>
      <button class="grande" id="bAbrir" type="button">Abrir câmera</button>
      <button class="sec" id="bFotoIni" type="button">Tirar foto do QR</button>
      <button class="sec" id="bDigitarIni" type="button">Digitar o lote</button>
    </div>
  </section>
  <div class="barra">
    <button class="btn" id="bVarios" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h12v12H4zM8 3h12v12"/></svg>Vários</button>
    <button class="btn" id="bLanterna" type="button" aria-pressed="false" hidden><svg viewBox="0 0 24 24"><path d="M9 2h6l-1 6h-4zM10 8v3a2 2 0 0 0 4 0V8M12 14v8"/></svg>Lanterna</button>
    <button class="btn" id="bFoto" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>Foto</button>
    <button class="btn" id="bDigitar" type="button"><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8"/></svg>Digitar</button>
  </div>
</div>
<div id="veu" aria-hidden="true"><i></i><span id="veuTxt">Abrindo o app…</span></div>
<input type="file" id="arquivo" accept="image/*" capture="environment" class="oculto">
<dialog id="dDigitar"><form method="dialog" id="fDigitar"><h2>Digitar o lote</h2><p>Exemplo: <b>221026-2/7</b></p>
  <input id="iLote" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="221026-2/7">
  <div class="acoes"><button type="button" id="dDigCancel">Cancelar</button><button type="submit" class="ok">OK</button></div></form></dialog>
<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var cena = $("cena"), video = $("video"), msg = $("msg");
var LS_APP = "scanner_app_url", LS_VARIOS = "scanner_varios", MAX_LISTA = 40;
function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
// Só aceita endereço de app do Google Apps Script (um QR qualquer não leva o celular para outro site)
function urlAppValida(t){
  var u; try{ u = new URL(String(t).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:" || u.hostname !== "script.google.com") return null;
  return /^\/(a\/macros\/[^\/]+\/|a\/[^\/]+\/)?macros\/s\/[^\/]+\/(exec|dev)$/.test(u.pathname) ? u : null;
}
var RE_LOTE = /^[A-Za-z0-9._-]{3,30}\/\d{1,4}$/;
var TXT_PADRAO = "Aponte para o QR da etiqueta";
var timerMsg = null;
function definirMsg(t, classe, voltaEm){
  clearTimeout(timerMsg);
  msg.textContent = t; cena.classList.remove("lido","erro"); if(classe) cena.classList.add(classe);
  if(voltaEm) timerMsg = setTimeout(function(){ if(!travado) definirMsg(varios ? textoVarios() : TXT_PADRAO); }, voltaEm);
}
function vibrar(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ---------- endereço do app e lote lido ---------- */
function guardarApp(u){ var b = new URL(u.toString()); b.search = ""; b.hash = ""; lsSet(LS_APP, b.toString()); }
// Devolve { lote, app } a partir do texto lido (link do app com ?l= ou só o número do lote)
function lerTexto(texto){
  var t = String(texto || "").trim(), u = urlAppValida(t);
  if(u){ guardarApp(u); return { lote: u.searchParams.get("l") || "", app: u, link: true }; }
  if(RE_LOTE.test(t)) return { lote: t, app: urlAppValida(lsGet(LS_APP)) };
  return null;
}
function abrirApp(url){
  travado = true; parar();
  cena.classList.add("saindo"); document.body.classList.add("saindo");
  setTimeout(function(){ window.location.href = url; }, 380);
}

/* ---------- modo "vários envelopes" ---------- */
var varios = lsGet(LS_VARIOS) === "1", lidos = [];
function textoVarios(){ return lidos.length ? lidos.length + " na lista · leia o próximo ou toque em Registrar" : "Modo vários envelopes: leia um por um"; }
function aplicarModo(){
  cena.classList.toggle("varios", varios);
  $("bVarios").setAttribute("aria-pressed", varios ? "true" : "false");
  $("titulo").textContent = varios ? "Escanear vários envelopes" : "Escanear envelope";
  $("sub").textContent = varios ? "Leia todos os envelopes e toque em Registrar no fim" : "Aproxime o QR até ele preencher a moldura · toque na tela para focar";
  renderLista(); definirMsg(varios ? textoVarios() : TXT_PADRAO);
}
function renderLista(){
  $("chips").innerHTML = lidos.length ? lidos.map(function(l){ return "<span>" + l.replace(/[<>&"]/g, "") + "</span>"; }).join("") : "<em>Nenhum envelope lido ainda</em>";
  var c = $("chips"); c.scrollLeft = c.scrollWidth;
  $("bRegistrar").disabled = !lidos.length;
  $("bRegistrar").textContent = lidos.length ? "Registrar " + lidos.length + " envelope" + (lidos.length === 1 ? "" : "s") : "Registrar envelopes";
}
function adicionar(lote){
  if(lidos.indexOf(lote) >= 0){ definirMsg("Já está na lista: " + lote, "erro", 1500); vibrar([40,40,40]); return; }
  if(lidos.length >= MAX_LISTA){ definirMsg("Máximo de " + MAX_LISTA + " envelopes. Toque em Registrar.", "erro", 2500); return; }
  lidos.push(lote); vibrar(60); renderLista();
  definirMsg("✓ " + lote + " · " + lidos.length + " na lista", "lido", 1200);
}
function registrarLista(){
  if(!lidos.length) return;
  var app = urlAppValida(lsGet(LS_APP));
  if(!app){ definirMsg("Abra este leitor pelo botão Escanear do app.", "erro"); return; }
  app.searchParams.set("l", lidos.join(","));
  $("veuTxt").textContent = "Registrando " + lidos.length + " envelope" + (lidos.length === 1 ? "" : "s") + "…";
  abrirApp(app.toString());
}

/* ---------- leitura ---------- */
var travado = false, ultimoTexto = "", ultimoQuando = 0;
function tratar(texto){
  if(travado) return;
  var agora = Date.now();
  if(texto === ultimoTexto && agora - ultimoQuando < 2500) return;
  ultimoTexto = texto; ultimoQuando = agora;
  var d = lerTexto(texto);
  if(!d || (!d.lote && !(d.link && !varios))){ definirMsg("Este QR não é de um envelope do app.", "erro", 2200); return; }
  if(varios){ adicionar(d.lote); return; }
  if(!d.app){ definirMsg("Lote " + d.lote + " lido, mas abra este leitor pelo botão Escanear do app.", "erro"); return; }
  if(!d.link) d.app.searchParams.set("l", d.lote);
  vibrar(60);
  definirMsg("Lido: " + (d.lote || "link do app") + " — abrindo o app…", "lido");
  $("veuTxt").textContent = "Registrando " + (d.lote || "") + "…";
  abrirApp(d.app.toString());
}

/* ---------- decodificadores ---------- */
var detector = null, jsqrPronto = null;
function prepararDetector(){
  if(detector !== null) return Promise.resolve(detector);
  if(!("BarcodeDetector" in window)){ detector = false; return Promise.resolve(false); }
  var p = BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats() : Promise.resolve(["qr_code"]);
  return p.then(function(f){ detector = f.indexOf("qr_code") >= 0 ? new BarcodeDetector({ formats: ["qr_code"] }) : false; return detector; })
          .catch(function(){ detector = false; return false; });
}
var FONTES = ["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js","https://unpkg.com/jsqr@1.4.0/dist/jsQR.js","https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"];
function carregarJsQR(){
  if(window.jsQR) return Promise.resolve();
  if(jsqrPronto) return jsqrPronto;
  jsqrPronto = new Promise(function(ok, falha){
    var i = 0;
    (function tentar(){
      if(window.jsQR) return ok();
      if(i >= FONTES.length){ jsqrPronto = null; return falha(new Error("jsQR")); }
      var s = document.createElement("script"); s.src = FONTES[i++]; s.crossOrigin = "anonymous";
      s.onload = function(){ window.jsQR ? ok() : tentar(); }; s.onerror = function(){ s.remove(); tentar(); };
      document.head.appendChild(s);
    })();
  });
  return jsqrPronto;
}
var tela = document.createElement("canvas"), tctx = tela.getContext("2d", { willReadFrequently: true });
// Lê só o quadrado central (onde está a moldura) em boa resolução: QR pequeno da etiqueta é lido mais fácil.
function lerComJsQR(fonte, w, h, inteiro){
  var lado = inteiro ? Math.max(w, h) : Math.min(w, h) * 0.8;
  var sx = inteiro ? 0 : (w - lado) / 2, sy = inteiro ? 0 : (h - lado) / 2, sw = inteiro ? w : lado, sh = inteiro ? h : lado;
  var esc = Math.min(1, 800 / Math.max(sw, sh)), cw = Math.max(1, Math.round(sw * esc)), ch = Math.max(1, Math.round(sh * esc));
  tela.width = cw; tela.height = ch;
  tctx.drawImage(fonte, sx, sy, sw, sh, 0, 0, cw, ch);
  var r = window.jsQR(tctx.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: "dontInvert" });
  return r && r.data ? r.data : null;
}
function lerQuadro(fonte, w, h, inteiro){
  if(detector) return detector.detect(fonte).then(function(r){ return r && r[0] ? r[0].rawValue : null; }).catch(function(){ return null; });
  if(window.jsQR) return Promise.resolve(lerComJsQR(fonte, w, h, inteiro));
  return Promise.resolve(null);
}

/* ---------- câmera ---------- */
var stream = null, rodando = false, timer = null, trilha = null;
function parar(){
  rodando = false; clearTimeout(timer);
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  trilha = null; cena.classList.remove("ao-vivo");
  try{ video.srcObject = null; }catch(e){}
}
function semCamera(titulo, texto, mostrarAbrir){
  parar(); cena.classList.add("sem-camera");
  $("tIni").textContent = titulo; $("pIni").textContent = texto; $("bAbrir").classList.toggle("oculto", !mostrarAbrir);
}
function erroCamera(e){
  var n = e && e.name || "";
  if(n === "NotAllowedError" || n === "SecurityError") semCamera("Câmera bloqueada", "Permita a câmera no ícone ao lado do endereço (cadeado ou “aA”) e tente de novo. Ou tire uma foto do QR.", true);
  else if(n === "NotFoundError" || n === "OverconstrainedError") semCamera("Câmera não encontrada", "Use a foto ou digite o lote.", false);
  else if(n === "NotReadableError") semCamera("Câmera em uso", "Feche o outro aplicativo que usa a câmera e tente de novo.", true);
  else semCamera("Não consegui abrir a câmera", "Tente de novo, ou use a foto ou digite o lote.", true);
}
// Foco contínuo e um pouco de zoom quando o aparelho deixa (ajuda a ler etiqueta pequena sem encostar)
function ajustarCamera(){
  var cap = {}; try{ cap = trilha.getCapabilities ? trilha.getCapabilities() : {}; }catch(e){}
  var adv = {};
  if(cap.focusMode && cap.focusMode.indexOf("continuous") >= 0) adv.focusMode = "continuous";
  if(cap.zoom && cap.zoom.max >= 1.5) adv.zoom = Math.min(cap.zoom.max, 1.5);
  if(Object.keys(adv).length) trilha.applyConstraints({ advanced: [adv] }).catch(function(){});
  $("bLanterna").hidden = !cap.torch;
}
function focar(){
  if(!trilha) return;
  var cap = {}; try{ cap = trilha.getCapabilities ? trilha.getCapabilities() : {}; }catch(e){}
  if(cap.focusMode && cap.focusMode.indexOf("single-shot") >= 0){
    trilha.applyConstraints({ advanced: [{ focusMode: "single-shot" }] })
      .then(function(){ setTimeout(ajustarCamera, 800); }).catch(function(){});
  }
}
function iniciar(){
  if(travado) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ semCamera("Câmera indisponível aqui", "Use a foto ou digite o lote.", false); return; }
  cena.classList.remove("sem-camera");
  var pedido = { audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } };
  Promise.all([navigator.mediaDevices.getUserMedia(pedido), prepararDetector()])
  .then(function(r){
    stream = r[0]; trilha = stream.getVideoTracks()[0]; video.srcObject = stream;
    var pl = video.play(); if(pl && pl.catch) pl.catch(function(){});
    ajustarCamera();
    return detector ? null : carregarJsQR();
  })
  .then(function(){ if(!stream) return; rodando = true; ciclo(); })
  .catch(function(e){ if(e && e.message === "jsQR") semCamera("Leitor não carregou", "Confira a internet e tente de novo, ou use a foto.", true); else erroCamera(e); });
}
video.addEventListener("playing", function(){ cena.classList.add("ao-vivo"); });
var ocupado = false;
function ciclo(){
  if(!rodando) return;
  timer = setTimeout(ciclo, detector ? 100 : 120);
  if(ocupado || video.readyState < 2 || !video.videoWidth) return;
  ocupado = true;
  lerQuadro(video, video.videoWidth, video.videoHeight, false).then(function(t){ ocupado = false; if(t && rodando) tratar(t); });
}
cena.addEventListener("click", function(e){ if(!e.target.closest("button") && !e.target.closest("#inicio") && !e.target.closest("#lista")) focar(); });
$("bLanterna").addEventListener("click", function(){
  if(!trilha) return;
  var liga = this.getAttribute("aria-pressed") !== "true", btn = this;
  trilha.applyConstraints({ advanced: [{ torch: liga }] }).then(function(){ btn.setAttribute("aria-pressed", liga ? "true" : "false"); }).catch(function(){ btn.hidden = true; });
});
$("bVarios").addEventListener("click", function(){ varios = !varios; lsSet(LS_VARIOS, varios ? "1" : ""); aplicarModo(); });
$("bRegistrar").addEventListener("click", registrarLista);
$("limpar").addEventListener("click", function(){ lidos = []; renderLista(); definirMsg(textoVarios()); });

/* ---------- foto (plano B) ---------- */
function abrirFoto(){ $("arquivo").value = ""; $("arquivo").click(); }
$("bFoto").addEventListener("click", abrirFoto); $("bFotoIni").addEventListener("click", abrirFoto);
$("arquivo").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  definirMsg("Lendo a foto…"); cena.classList.remove("sem-camera");
  var prep = prepararDetector().then(function(d){ return d ? null : carregarJsQR(); });
  var bmp = window.createImageBitmap ? createImageBitmap(f) : new Promise(function(ok, falha){
    var im = new Image(), u = URL.createObjectURL(f); im.onload = function(){ URL.revokeObjectURL(u); ok(im); }; im.onerror = falha; im.src = u; });
  Promise.all([bmp, prep]).then(function(r){
    var img = r[0];
    return lerQuadro(img, img.width, img.height, true).then(function(t){
      if(t){ ultimoTexto = ""; tratar(t); }
      else { definirMsg("Não achei um QR na foto. Chegue mais perto e tente de novo.", "erro"); if(!stream) semCamera("Câmera desligada", "Tire outra foto, abra a câmera ou digite o lote.", true); }
    });
  }).catch(function(){ definirMsg("Não consegui ler essa foto.", "erro"); });
});

/* ---------- digitar ---------- */
var dDig = $("dDigitar");
function abrirDig(){
  if(typeof dDig.showModal !== "function"){ var v = window.prompt("Número do lote (ex.: 221026-2/7)"); if(v){ ultimoTexto = ""; tratar(v.trim()); } return; }
  $("iLote").value = ""; dDig.showModal(); setTimeout(function(){ $("iLote").focus(); }, 50);
}
$("bDigitar").addEventListener("click", abrirDig); $("bDigitarIni").addEventListener("click", abrirDig);
$("dDigCancel").addEventListener("click", function(){ dDig.close(); });
$("fDigitar").addEventListener("submit", function(ev){ ev.preventDefault(); var v = $("iLote").value.trim(); dDig.close(); if(v){ ultimoTexto = ""; tratar(v); } });

/* ---------- ?app= vindo do app ---------- */
try{
  var p = new URLSearchParams(location.search).get("app");
  if(p){ var u = urlAppValida(p); if(u) guardarApp(u); history.replaceState(null, "", location.pathname); }
}catch(e){}

$("bAbrir").addEventListener("click", iniciar);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) parar(); else if(!travado && !cena.classList.contains("sem-camera") && !stream) iniciar();
});
// Voltou para o leitor pelo botão "voltar" do celular: começa de novo, com a lista vazia
window.addEventListener("pageshow", function(ev){
  if(ev.persisted){ travado = false; ultimoTexto = ""; lidos = []; cena.classList.remove("lido","erro","saindo"); document.body.classList.remove("saindo"); aplicarModo(); iniciar(); }
});
aplicarModo();
iniciar();
})();
</script>
